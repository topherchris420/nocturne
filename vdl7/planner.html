<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nocturne Planner</title>
<link rel="icon" href="data:,">
<style>
/* A working tool for one engineer at a desk: tabs for the inputs in the order
   they are usually gathered, a check panel that is always visible, and the plan
   one click away. It shares DC Tonight's night palette, tokens and header.
   System fonts only, Georgia for display: it must work offline. */
:root {
  --bg: #071519; --panel: #0e2429; --raised: #173238; --field: #081b1f; --sunken: #0a1c21;
  --line: #2c4549; --edge: #446268; --text: #edf4ed; --muted: #adc3c2; --faint: #8aa3a2;
  --teal: #9fe2cf; --gold: #f7cf8d; --bad: #ffb4aa; --ink: #08201b;
  --notice: #332a1c; --notice-ink: #f8dfb5; --danger: #3b2423; --serif: Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
a { color: var(--teal); }
button, input, select, textarea { font: inherit; color: inherit; }
input:focus, textarea:focus, select:focus, button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* The same brand and tool switch as DC Tonight */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 14px 24px;
  border-bottom: 1px solid var(--line); background: var(--bg); }
@media (min-width: 961px) { .top { position: sticky; top: 0; z-index: 5; } }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: .14em; font-size: 13px; }
.mark { width: 18px; height: 18px; fill: var(--teal); } .mark circle { fill: none; stroke: var(--teal); stroke-width: 1.3; opacity: .5; }
.apps { display: flex; gap: 4px; flex-wrap: wrap; }
.apps > a, .apps > span { font-size: 14px; line-height: 1; padding: 9px 14px; border-radius: 999px; color: var(--muted);
  text-decoration: none; border: 1px solid transparent; }
.apps > a:hover { color: var(--text); border-color: var(--line); }
.apps > [aria-current] { color: var(--text); background: var(--raised); border-color: var(--line); }
.file { color: var(--muted); font-size: 13px; flex: 1; min-width: 140px; overflow-wrap: anywhere; }
.file .dirty { color: var(--gold); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; max-width: 100%; }

.btn, button { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; color: var(--text);
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover, button:hover { border-color: var(--teal); }
button:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); }
button.primary { background: var(--teal); color: var(--ink); border-color: var(--teal); font-weight: 700; }
button.link { background: none; border: none; padding: 0; color: var(--teal); text-decoration: underline; }
button.danger { color: var(--bad); }
select { background: var(--field); border: 1px solid var(--edge); border-radius: 6px; padding: 7px 8px; }

/* New: a menu of buttons, so browsing it never replaces the project */
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu[open] > summary { border-color: var(--teal); }
.menu-list { position: absolute; z-index: 6; top: calc(100% + 6px); left: 0; width: max-content; max-width: min(340px, 86vw);
  display: grid; gap: 2px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .45); }
.menu-list button { background: none; border-color: transparent; text-align: left; width: 100%; }
.menu-list button:hover { background: var(--raised); border-color: var(--line); }

.notice { margin: 14px 24px 0; padding: 11px 15px; border-left: 3px solid var(--gold); background: var(--notice); color: var(--notice-ink);
  border-radius: 4px; font-size: 14px; }
.tabs { display: flex; gap: 2px; padding: 0 24px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--muted);
  white-space: nowrap; padding: 14px 12px 12px; }
.tabs button:hover { color: var(--text); border-bottom-color: var(--edge); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--teal); }
.tabs .num { font: 600 11px var(--mono); color: var(--teal); }
.tabs button .count { font-size: 12px; color: var(--bad); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; padding: 26px 24px 40px; align-items: start; }
@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 20px 18px 32px; }
  .top { padding: 12px 18px; } .tabs { padding: 0 10px; } .notice { margin: 12px 18px 0; }
}
.short { display: none; }
@media (max-width: 600px) { .long { display: none; } .short { display: inline; } }
section[role="tabpanel"] { min-width: 0; }
.eyebrow { color: var(--teal); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 2px 0 10px; }
h1 { font: normal 34px/1.12 var(--serif); letter-spacing: -.02em; margin: 0 0 10px; }
h1.display { font-size: clamp(34px, 4.2vw, 50px); line-height: 1.06; letter-spacing: -.035em; max-width: 900px; margin-bottom: 16px; }
h1 em { color: var(--teal); }
h1.display em { display: block; }
h2 { font-size: 18px; margin: 28px 0 10px; }
h3 { font-size: 15px; margin: 0; }
.lead { color: var(--muted); max-width: 760px; margin: 0 0 18px; font-size: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin: 0 0 14px; }
.card.sub { background: var(--sunken); border-radius: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); min-width: 120px; }
label.field.wide { flex: 1 1 280px; }
label.check { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--teal); flex-shrink: 0; }
input[type="text"], input:not([type]), textarea { background: var(--field); border: 1px solid var(--edge); border-radius: 6px;
  padding: 8px 10px; width: 100%; color: var(--text); }
textarea { min-height: 64px; resize: vertical; }
.bad { border-color: var(--bad) !important; background: var(--danger) !important; }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--gold); } to { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
.id { font-family: var(--mono); font-size: 12px; color: var(--faint); }
.hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.scroll { overflow-x: auto; }
table.grid { border-collapse: collapse; min-width: 100%; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: middle; }
table.grid th { font-size: 13px; color: var(--muted); font-weight: 600; }
table.grid td input { min-width: 92px; font-family: var(--mono); font-size: 13px; }
table.grid tr.unmanaged td:first-child { color: var(--muted); font-style: italic; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.head h1 { margin: 0; }
aside { position: sticky; top: 92px; }
@media (max-width: 960px) { aside { position: static; } }
.status { font-weight: 650; margin: 0 0 12px; }
.status.ok { color: var(--teal); } .status.no { color: var(--bad); }
.issues { list-style: none; margin: 0; padding: 0; max-height: 60vh; overflow: auto; }
.issues li { margin: 0 0 8px; font-size: 13px; }
.issues li button { text-align: left; display: block; width: 100%; background: var(--sunken); padding: 9px 12px; }
.issues li.problem button { border-left: 3px solid var(--bad); }
.issues li.warning button { border-left: 3px solid var(--gold); }
.issues .where { display: block; font-family: var(--mono); font-size: 11px; color: var(--faint); overflow-wrap: anywhere; margin-top: 3px; }
.verdict { font: normal clamp(30px, 3.4vw, 44px)/1.1 var(--serif); letter-spacing: -.025em; margin: 22px 0 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 6px 0 20px; }
.stats div { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.stats strong { display: block; font-size: 28px; line-height: 1.2; color: var(--teal); font-weight: 650; margin-bottom: 2px; }
.targets { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.target { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 13px; }
.target.uncertain { border-color: var(--gold); } .target.not_met { border-color: var(--bad); }
.target strong { display: block; font-size: 15px; margin: 2px 0; }
.target .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--teal); }
.bar { position: relative; height: 10px; border-radius: 5px; background: #34555b; margin: 12px 0 10px; }
.bar span { position: absolute; left: 0; top: 0; height: 100%; border-radius: 5px; background: var(--teal); }
.bar i { position: absolute; top: 0; height: 100%; background: repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 3px, transparent 3px 6px); }
.bar b { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--text); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; color: var(--ink); }
.pill.met { background: var(--teal); } .pill.uncertain { background: var(--gold); } .pill.not_met { background: var(--bad); }
details summary { cursor: pointer; color: var(--muted); }
.muted { color: var(--muted); }
.empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 20px 18px; text-align: center; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--teal);
  padding: 11px 18px; border-radius: 10px; z-index: 10; max-width: 90vw; box-shadow: 0 12px 30px rgba(0, 0, 0, .4); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 12px; max-width: 820px; }
.steps li { counter-increment: step; border-top: 1px solid var(--line); padding: 10px 0 0 36px; position: relative; color: var(--muted); }
.steps li::before { content: counter(step, decimal-leading-zero); position: absolute; left: 0; top: 10px; color: var(--teal); font-weight: 700; }
.steps strong { color: var(--text); }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg class="mark" viewBox="-11 -11 22 22" aria-hidden="true"><circle r="9.5"/><path d="M0 -10A10 10 0 0 1 0 10A3.5 10 0 0 0 0 -10Z"/></svg>NOCTURNE</div>
  <nav class="apps" aria-label="Nocturne tools"><span aria-current="page"><span class="long">Restoration planner</span><span class="short">Planner</span></span><a id="tonightLink" href="/tonight">DC Tonight</a></nav>
  <div class="file" id="file" aria-live="polite">Loading…</div>
  <div class="actions">
    <details class="menu" id="newMenu"><summary class="btn">New <span aria-hidden="true">▾</span></summary><div class="menu-list" id="examples"></div></details>
    <button id="openFile" type="button">Open file…</button><input type="file" id="open" accept=".json,application/json" hidden>
    <button id="save" title="Save back to the file this session was started with">Save</button>
    <button id="download">Download project</button>
  </div>
</header>
<div id="notice" class="notice" hidden></div>
<nav class="tabs" role="tablist" aria-label="Project sections" id="tabs"></nav>
<div class="layout">
  <section role="tabpanel" id="panel" aria-live="polite"></section>
  <aside class="card" aria-label="Checks">
    <p class="eyebrow">Checks</p>
    <p class="status" id="status">Checking…</p>
    <ul class="issues" id="issues"></ul>
    <p class="hint">Checked as you type, with the same rules the command line uses. Click an item to go to the field.</p>
  </aside>
</div>
<script>
"use strict";
// ---------------------------------------------------------------- values
// <values> (exercised by tests/test_app.py through Node)
function fmtNumber(x) { return String(Number(Number(x).toPrecision(6))); }
function formatValue(v) { return Array.isArray(v) ? v.map(fmtNumber).join(" – ") : (v === undefined || v === null ? "" : fmtNumber(v)); }
function parseValue(text, opts) {
  const o = Object.assign({ range: true, negative: false }, opts || {});
  const t = String(text).trim().replace(/−/g, "-");
  const usage = o.range ? "use a number like 0.4, or a range like 0.3 – 0.5" : "use a number like 0.4";
  if (t === "") return { error: "enter a value: " + usage };
  const num = (s) => /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s) ? Number(s) : NaN;
  const hyphen = t.match(/^(\d*\.?\d+)\s*-\s*(\d*\.?\d+)$/);
  const parts = hyphen ? [hyphen[1], hyphen[2]] : t.split(/\s*(?:–|—|\.\.|\bto\b|;|\/)\s*/i).filter((p) => p !== "");
  const values = parts.map(num);
  if (!values.length || values.some((v) => !isFinite(v))) return { error: usage };
  if (!o.negative && values.some((v) => v < 0)) return { error: "cannot be negative" };
  if (values.length === 1) return { value: values[0] };
  if (!o.range) return { error: "a single number here (" + usage + ")" };
  if (values.length > 3) return { error: "a range is low – high, or low – central – high" };
  for (let i = 1; i < values.length; i++) if (values[i] < values[i - 1]) return { error: "a range runs from low to high" };
  if (values[0] === values[values.length - 1]) return { value: values[0] };
  return { value: values };
}
function parseMoney(text) {
  const t = String(text).trim().replace(/[$,\s]/g, "");
  if (!/^(\d+\.?\d{0,2}|\.\d{1,2})$/.test(t)) return { error: "a dollar amount like 2400 or 2400.50" };
  return { value: Number(t) };
}
function slug(text, taken) {
  const base = String(text).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32) || "item";
  let id = base, n = 2;
  while (taken.includes(id) || id === "keep") id = base + "-" + n++;
  return id;
}
// </values>

// ---------------------------------------------------------------- state
const token = new URLSearchParams(location.hash.slice(1)).get("token") || sessionStorage.getItem("nocturne-token") || "";
document.getElementById("tonightLink").href = "/tonight#token=" + encodeURIComponent(token);
if (token) { sessionStorage.setItem("nocturne-token", token); history.replaceState(null, "", location.pathname); }
const state = { project: null, file: "", writable: false, fromFile: false, dirty: false, tab: "project",
                check: { problems: [], warnings: [] }, result: null, budget: null, solving: false };
const TABS = [["project", "Project"], ["places", "Places & targets"], ["conditions", "Conditions"],
              ["sources", "Sources & options"], ["light", "Light contributions"], ["interactions", "Interactions"], ["plan", "Plan"]];

async function api(method, route, body) {
  let res;
  try {
    res = await fetch(route, { method, headers: Object.assign({ "X-Nocturne-Token": token },
      body ? { "Content-Type": "application/json" } : {}), body: body ? JSON.stringify(body) : undefined });
  } catch (err) {
    throw new Error("Nocturne isn’t answering. Is “nocturne app” still running in your terminal?");
  }
  const type = res.headers.get("Content-Type") || "";
  const data = type.startsWith("application/json") ? await res.json() : await res.text();
  if (res.status === 403) throw new Error("This page’s session has ended. Open the address “nocturne app” printed in your terminal.");
  if (!res.ok) { const err = new Error((data && data.error) || res.statusText); err.data = data; err.status = res.status; throw err; }
  return data;
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else if (k === "dataset") Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
function toast(text) {
  const t = h("div", { class: "toast", role: "status", text });
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

const P = () => state.project;
const ids = (list) => list.map((x) => x.id);
const receptors = () => P().receptors || [];
const scenarios = () => P().scenarios || [];
const sources = () => P().sources || [];

function changed(structural) {
  state.dirty = true; state.result = null;
  ensureVersion();
  renderFile();
  scheduleCheck();
  if (structural) render();
}
function ensureVersion() {
  // Ranges, per-place effects and interactions need schema 2; a version 1 file is upgraded only when one is used.
  const p = P();
  if (p.schema_version === 2) return;
  const hasRange = (v) => Array.isArray(v) || (v !== null && typeof v === "object" && Object.values(v).some(hasRange));
  const ranged = (p.scenarios || []).some((sc) => hasRange(sc.unmanaged_mcd_m2) || hasRange(sc.contributions_mcd_m2)) ||
                 (p.sources || []).some((s) => (s.options || []).some((o) => hasRange(o.remaining_fraction)));
  const perPlace = (p.sources || []).some((s) => (s.options || []).some((o) => Object.values(o.remaining_fraction || {}).some((v) => v && typeof v === "object" && !Array.isArray(v))));
  if (ranged || perPlace || (p.interactions && p.interactions.length)) {
    p.schema_version = 2;
    toast("Upgraded to project format 2 to hold ranges, per-place effects or interactions.");
  }
}

// ---------------------------------------------------------------- fields
function textField(obj, key, path, label, opts) {
  const o = opts || {};
  const input = h(o.multiline ? "textarea" : "input", { "aria-label": label, dataset: { path }, placeholder: o.placeholder,
    oninput: (e) => { obj[key] = e.target.value; changed(false); if (o.after) o.after(); } });
  input.value = obj[key] === undefined ? "" : obj[key];
  return o.bare ? input : h("label", { class: "field" + (o.wide ? " wide" : "") }, label, input);
}
function valueField(obj, key, path, label, opts) {
  const o = opts || {};
  const input = h("input", { "aria-label": label, dataset: { path }, inputmode: "decimal", title: o.title });
  input.value = o.money ? (obj[key] === undefined ? "" : String(obj[key])) : formatValue(obj[key]);
  input.addEventListener("input", () => {
    let parsed = o.money ? parseMoney(input.value) : parseValue(input.value, o);
    if (!parsed.error && o.max !== undefined && [].concat(parsed.value).some((v) => v > o.max)) parsed = { error: "at most " + o.max };
    input.classList.toggle("bad", !!parsed.error);
    input.title = parsed.error || o.title || "";
    if (parsed.error) input.dataset.localError = "1"; else delete input.dataset.localError;
    if (!parsed.error) { obj[key] = parsed.value; if (o.onvalue) o.onvalue(parsed.value); else changed(false); }
  });
  input.addEventListener("blur", () => { if (!input.classList.contains("bad")) input.value = o.money ? String(obj[key]) : formatValue(obj[key]); });
  if (o.paste) input.addEventListener("paste", (e) => o.paste(e, input));
  return o.bare ? input : h("label", { class: "field" }, label, input);
}
function checkField(obj, key, path, label) {
  const input = h("input", { type: "checkbox", dataset: { path }, onchange: (e) => { obj[key] = e.target.checked; changed(false); } });
  input.checked = !!obj[key];
  return h("label", { class: "check" }, input, label);
}

// ---------------------------------------------------------------- structure edits
function addReceptor() {
  const id = slug("place-" + (receptors().length + 1), ids(receptors()));
  receptors().push({ id, label: "Observation point " + (receptors().length + 1), target_mcd_m2: 1 });
  for (const sc of scenarios()) {
    sc.unmanaged_mcd_m2[id] = 0;
    for (const s of sources()) (sc.contributions_mcd_m2[s.id] = sc.contributions_mcd_m2[s.id] || {})[id] = 0;
  }
  for (const s of sources()) for (const o of s.options) for (const v of Object.values(o.remaining_fraction)) if (isPerPlace(v)) v[id] = 1;
  for (const k of P().interactions || []) for (const v of Object.values(k.delta_mcd_m2)) if (isPerPlace(v)) v[id] = 0;
  changed(true);
}
function removeReceptor(id) {
  if (receptors().length < 2) return toast("A project needs at least one observation point.");
  P().receptors = receptors().filter((r) => r.id !== id);
  for (const sc of scenarios()) { delete sc.unmanaged_mcd_m2[id]; for (const row of Object.values(sc.contributions_mcd_m2)) delete row[id]; }
  for (const s of sources()) for (const o of s.options) for (const v of Object.values(o.remaining_fraction)) if (isPerPlace(v)) delete v[id];
  for (const k of P().interactions || []) for (const v of Object.values(k.delta_mcd_m2)) if (isPerPlace(v)) delete v[id];
  changed(true);
}
function addScenario() {
  const first = scenarios()[0];
  const id = slug("condition-" + (scenarios().length + 1), ids(scenarios()));
  const copy = JSON.parse(JSON.stringify(first || { unmanaged_mcd_m2: {}, contributions_mcd_m2: {} }));
  scenarios().push({ id, label: first ? "Copy of " + first.label : "Condition " + (scenarios().length + 1),
                     unmanaged_mcd_m2: copy.unmanaged_mcd_m2, contributions_mcd_m2: copy.contributions_mcd_m2 });
  for (const s of sources()) for (const o of s.options) o.remaining_fraction[id] = JSON.parse(JSON.stringify(first ? o.remaining_fraction[first.id] : 1));
  for (const k of P().interactions || []) k.delta_mcd_m2[id] = JSON.parse(JSON.stringify(first ? k.delta_mcd_m2[first.id] : 0));
  changed(true);
}
function removeScenario(id) {
  if (scenarios().length < 2) return toast("A project needs at least one condition.");
  P().scenarios = scenarios().filter((s) => s.id !== id);
  for (const s of sources()) for (const o of s.options) delete o.remaining_fraction[id];
  for (const k of P().interactions || []) delete k.delta_mcd_m2[id];
  changed(true);
}
function newOption(taken) {

    const errors = [];

      const rk = rowKeys[rowIndex + i], ck = colKeys[colIndex + j];

      const parsed = parseValue(cell);
      if (parsed.error) { errors.push(`${cell.trim() || "(blank)"}`); return; }
      const target = rk === "__unmanaged" ? sc.unmanaged_mcd_m2 : sc.contributions_mcd_m2[rk];
      target[ck] = parsed.value;

      h("p", { text: `${u.ranged_values} value(s) are ranges; every target is checked at the pessimistic end.` + (
        u.cost_of_uncertainty_usd > 0
          ? ` On central values the cheapest plan costs $${u.central_plan.cost_usd.toLocaleString()}: planning for the pessimistic case costs $${u.cost_of_uncertainty_usd.toLocaleString()} more. Measuring the largest remaining terms is how to recover it.`
          : u.cost_of_uncertainty_usd === 0 ? " The ranges do not change the price: central values give a plan of the same cost." : "") }));
  }
  if ((r.interactions || []).length) out.push(h("h2", { text: "Interactions" }), h("ul", {}, r.interactions.map((k) => h("li", { text: (k.active ? "In effect: " : "Not triggered: ") + k.label }))));
  if (r.excluded_options.length) out.push(h("h2", { text: "Options the planner could not use" }),
    h("ul", {}, r.excluded_options.map((x) => h("li", { text: `${labels[x.source] || x.source} / ${x.option}: ${x.reasons.join("; ")}` }))));
  out.push(h("details", {}, h("summary", { text: "Limits of this result" }), h("ul", {}, r.limits.map((x) => h("li", { class: "hint", text: x })))));
  return out;
}
async function solveNow() {
  if (state.solving) return;
  state.solving = true; render();                       // the exact search can take a while: show it, and refuse a second click
  try {
    state.result = await api("POST", "/api/solve", { project: P(), budget_usd: state.budget });
  } catch (err) {
    state.result = null;
    if (err.data && err.data.problems) { state.check.problems = err.data.problems; renderChecks(); }
    toast("Could not plan: " + err.message);
  } finally { state.solving = false; }
  render();
}
async function openReport(save) {
  const win = save ? null : window.open("", "_blank");
  try {
    const html = await api("POST", "/api/report", { project: P(), budget_usd: state.budget });
    if (save) return download(html, fileBase() + "-brief.html", "text/html");
    const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    if (win) win.location = url; else location.assign(url);
  } catch (err) { if (win) win.close(); toast("Could not write the brief: " + err.message); }
}

// ---------------------------------------------------------------- checks
let checkTimer = null, checkSeq = 0;
function scheduleCheck() { clearTimeout(checkTimer); checkTimer = setTimeout(runCheck, 250); }
async function runCheck() {
  const seq = ++checkSeq;
  try {
    const result = await api("POST", "/api/check", { project: P() });
    if (seq !== checkSeq) return;
    state.check = result;
  } catch (err) {
    state.check = { problems: [{ path: "", message: err.message }], warnings: [] };
  }
  renderChecks(); renderTabs(); markProblems();
  if (state.tab === "plan" && !state.result) render();
}
function renderChecks() {
  const { problems, warnings } = state.check;
  const status = document.getElementById("status");
  status.className = "status " + (problems.length ? "no" : "ok");
  status.textContent = problems.length ? `${problems.length} problem${problems.length > 1 ? "s" : ""} to fix before planning` : "Ready to plan";
  const item = (kind) => (x) => h("li", { class: kind }, h("button", { onclick: () => goTo(x.path) },
    h("span", { text: x.message }), h("span", { class: "where", text: x.path || "project" })));
  document.getElementById("issues").replaceChildren(...problems.map(item("problem")), ...warnings.map(item("warning")));
}
function markProblems() {
  const paths = state.check.problems.map((x) => x.path).filter(Boolean);
  for (const el of document.querySelectorAll("[data-path]")) {
    const p = el.dataset.path;
    if (!p) continue;
    const hit = paths.some((q) => q === p || q.startsWith(p + "[") || q.startsWith(p + ".") || p.startsWith(q + ".") || p.startsWith(q + "["));
    el.classList.toggle("bad", hit || el.dataset.localError === "1");
  }
}
function goTo(path) {
  state.tab = tabFor(path); render();
  const all = [...document.querySelectorAll("[data-path]")];
  const el = all.find((e) => e.dataset.path === path) || all.find((e) => e.dataset.path.startsWith(path)) ||
             all.filter((e) => path.startsWith(e.dataset.path)).sort((a, b) => b.dataset.path.length - a.dataset.path.length)[0];
  if (el) { el.scrollIntoView({ block: "center" }); el.focus(); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1300); }
}

// ---------------------------------------------------------------- files
function fileBase() { return (state.file || P().title || "nocturne-project").replace(/\.json$/i, "").replace(/[^A-Za-z0-9._-]+/g, "-").slice(0, 60); }
function download(text, name, type) {
  const a = h("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); a.remove();
}
function renderFile() {
  const el = document.getElementById("file");
  el.replaceChildren(state.fromFile && state.file ? state.file : (P() ? (P().title || "Untitled") + " (not saved to a file)" : ""),
    state.dirty ? h("span", { class: "dirty", text: " · unsaved changes" }) : "");
  const save = document.getElementById("save");
  save.disabled = !state.writable;
  save.title = state.writable ? "Save to " + state.file + " (the previous version is kept as .bak)" : "Start with `nocturne app FILE.json` to save to a file; or download the project.";
}
function load(project, fromFile, notice) {
  state.project = project; state.fromFile = fromFile; state.dirty = false; state.result = null; state.budget = null;
  const n = document.getElementById("notice");
  n.hidden = !notice; n.textContent = notice || "";
  renderFile(); render(); runCheck();
}
function leaving() { return !state.dirty || confirm("Discard unsaved changes?"); }
document.getElementById("save").addEventListener("click", async () => {
  if (!state.fromFile && !confirm(`Replace ${state.file} with this project?`)) return;
  try {
    const r = await api("POST", "/api/save", { project: P() });
    state.dirty = false; state.fromFile = true; renderFile();
    toast(`Saved ${r.saved}` + (r.backup ? ` (previous version kept as ${r.backup})` : ""));
  } catch (err) { toast("Could not save: " + err.message); }
});
document.getElementById("download").addEventListener("click", () => {
  if (!P()) return;
  download(JSON.stringify(P(), null, 2) + "\n", fileBase() + ".json", "application/json");
  toast("Downloaded. Run it from the command line with: nocturne restore " + fileBase() + ".json");
});
// New is a menu of buttons: browsing it with the keyboard never replaces the project.
const menu = document.getElementById("newMenu");
document.getElementById("examples").addEventListener("click", async (e) => {
  const id = (e.target.closest("button") || {}).dataset.example;
  if (!id) return;
  menu.open = false;
  if (!leaving()) return;
  try { load(await api("GET", "/api/example/" + id), false, ""); } catch (err) { toast("Could not open the example: " + err.message); }
});
document.addEventListener("click", (e) => { if (menu.open && !menu.contains(e.target)) menu.open = false; });
menu.addEventListener("keydown", (e) => { if (e.key === "Escape" && menu.open) { menu.open = false; menu.querySelector("summary").focus(); } });
document.getElementById("openFile").addEventListener("click", () => document.getElementById("open").click());
document.getElementById("open").addEventListener("change", async (e) => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file || !leaving()) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (err) { return toast(file.name + " is not valid JSON: " + err.message); }
  try {
    if (data && data.schema) load(await api("POST", "/api/derive", { physical: data }), false,
      file.name + " is a physical district: its coefficients were derived from geometry and atmosphere. Download the result to keep it.");
    else load(data, false, "Opened " + file.name + " from your computer. Download to keep changes" + (state.writable ? `, or Save to replace ${state.file}.` : "."));
  } catch (err) {
    const problems = (err.data && err.data.problems) || [];
    toast("Could not open " + file.name + ": " + (problems.length ? problems.length + " problem(s), e.g. " + problems[0].path + ": " + problems[0].message : err.message));
  }
});
window.addEventListener("beforeunload", (e) => { if (state.dirty) { e.preventDefault(); e.returnValue = ""; } });

(async function start() {
  if (!token) { document.getElementById("panel").replaceChildren(h("p", { class: "empty", text: "Open the address “nocturne app” printed in your terminal, including its #token part." })); return; }
  try {
    const s = await api("GET", "/api/session");
    state.file = s.file; state.writable = s.writable;
    const list = document.getElementById("examples");
    for (const x of s.examples) list.append(h("button", { type: "button", dataset: { example: x.id }, text: x.title }));
    if (s.project) load(s.project, true, s.notice);
    else load(await api("GET", "/api/example/" + (s.examples.some((x) => x.id === "district") ? "district" : "blank")), false,
      "This example uses invented numbers. Choose New for a blank project, or Open file… for your own.");
  } catch (err) {
    document.getElementById("panel").replaceChildren(h("p", { class: "empty", text: err.message }));
    document.getElementById("file").textContent = "";
  }
})();
</script>
</body>
