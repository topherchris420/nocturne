[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturne-vdl7"
version = "1.0.0"
description = "Nocturne: VDL-7 dark-sky streetlight firmware and the city tools around it (business case, sky model, photometry, Night Signal, M&V, pilot) for VD-DSL-SPEC-001"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Christopher Woodyard (Vers3Dynamics)"}]
dependencies = ["cryptography>=41", "tzdata>=2024.1"]

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
nocturne = "vdl7.cli:main"

[tool.setuptools.packages.find]
include = ["vdl7*", "sim*"]

[tool.setuptools.package-data]
vdl7 = ["planner.html", "tonight.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
