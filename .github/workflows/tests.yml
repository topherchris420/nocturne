name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test
        run: |
          nocturne trace --road local --every 60 --offline-at 22:15 --event emergency@00:40:30 > /dev/null
          nocturne keygen --out /tmp/k.pem && nocturne bundle --key /tmp/k.pem --version 2 > /dev/null
          nocturne spectral > /dev/null
