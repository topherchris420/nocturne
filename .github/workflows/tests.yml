name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4          # the console parity test runs the page's controller in Node
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test
        run: |
          nocturne trace --road local --every 60 --offline-at 22:15 --event emergency@00:40:30 > /dev/null
          nocturne trace --site sydney --road local --every 60 --start "2027-01-15 19:00" --end "2027-01-16 07:00" > /dev/null
          nocturne keygen --out /tmp/k.pem && nocturne bundle --key /tmp/k.pem --version 2 > /dev/null
          echo '{"rock-creek-buffer": {"local": [60, 40, 30, 30, 30]}}' > /tmp/zones.json
          nocturne bundle --key /tmp/k.pem --version 3 --zones /tmp/zones.json > /dev/null
          nocturne spectral > /dev/null
          nocturne business-case > /dev/null
          nocturne sky --retrofits 3 > /dev/null
          nocturne bug examples/ies/synthetic-globe-4000lm-ulr15.ies > /dev/null
          nocturne trespass examples/ies/synthetic-roadway-6000lm-u0.ies --tunable > /dev/null
          nocturne signal --date 2026-10-14 --migration --key /tmp/k.pem --ics /tmp/c.ics --days 7 > /dev/null
          nocturne pilot --seed ci --out /tmp/plan.csv > /dev/null && nocturne pilot --power 0.0018 1.2 > /dev/null
          nocturne schedule --plan /tmp/plan.csv --wave 1 --out /tmp/phase0 > /dev/null
